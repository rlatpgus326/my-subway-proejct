<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 지하철 출발 현황 모니터</title>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: #111827;
            --accent-color: #3b82f6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;

            /* 지하철 공식 노선 색상 정밀 매핑 */
            --line-1: #0052A4;
            --line-2: #00A84D;
            --line-3: #EF7C1C;
            --line-4: #00A2D1;
            --line-5: #996CAC;
            --line-6: #CD7C2F;
            --line-7: #747F00;
            --line-8: #E6186C;
            --line-9: #BDB092;
            --line-suin: #F5A200;
            --line-gj: #77C4A3;
            --line-sbd: #D4003B;
            --line-ap: #0090D2;
            --line-kk: #003DA5;
            --line-sh: #81A914;
            --line-default: #64748b;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .monitor-container {
            width: 100%;
            max-width: 600px;
            background: #0f172a;
            border-radius: 16px;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            border-top: 8px solid #334155;
            overflow: hidden;
        }

        header {
            padding: 24px;
            background: #020617;
            border-bottom: 1px solid #334155;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #cbd5e1;
            text-transform: uppercase;
            font-weight: 800;
        }

        .live-status {
            font-size: 0.65rem;
            background: #dc2626;
            color: white;
            padding: 2px 10px;
            border: 1px solid #7f1d1d;
            animation: pulse 2s infinite;
        }

        .controls {
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }

        select,
        input {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        input {
            flex: 1;
        }

        .departure-feed {
            padding: 24px;
            min-height: 400px;
        }

        .departure-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 16px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid #334155;
            border-left: 8px solid var(--accent-color);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .line-badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.8);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .status-info {
            flex: 1;
        }

        .status-main {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .status-sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* 실제 철로 느낌의 트랙 애니메이션 */
        .track-container {
            margin-top: 15px;
            height: 10px;
            background: #0f172a;
            border-top: 2px solid #475569;
            border-bottom: 2px solid #475569;
            position: relative;
            overflow: visible;
        }

        .track-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(90deg, #334155 0px, #334155 3px, transparent 3px, transparent 15px);
            opacity: 0.8;
        }

        .track-progress {
            height: 2px;
            position: absolute;
            top: 4px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: width 1s linear;
            z-index: 2;
        }

        .train-icon {
            position: absolute;
            top: -12px;
            transform: translateX(-50%);
            font-size: 1.6rem;
            transition: left 1s linear;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6));
            z-index: 10;
        }

        /* 열차 주행 진동 애니메이션 */
        @keyframes trainWobble {

            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(-2px);
            }
        }

        .train-running {
            animation: trainWobble 0.2s infinite ease-in-out;
        }

        .departure-time {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight: 700;
            background: #000;
            padding: 8px 12px;
            border-radius: 4px;
            color: #fbbf24;
            /* Amber LED */
            min-width: 90px;
            text-align: center;
            border: 2px solid #334155;
            box-shadow: inset 0 0 10px rgba(251, 191, 36, 0.2);
            text-shadow: 0 0 5px #d97706;
        }

        /* 시간이 바뀔 때의 애니메이션 */
        .time-update {
            animation: timePop 0.4s ease-out;
        }

        @keyframes timePop {

            0%,
            100% {
                color: inherit;
            }

            50% {
                color: #fff;
            }
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        .urgent {
            color: #f87171 !important;
            /* Red LED */
            text-shadow: 0 0 5px #ef4444;
            box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.2);
            border-color: #7f1d1d;
        }

        .line-1 {
            background-color: var(--line-1);
        }

        .line-2 {
            background-color: var(--line-2);
        }

        .line-3 {
            background-color: var(--line-3);
        }

        .line-4 {
            background-color: var(--line-4);
        }

        .line-5 {
            background-color: var(--line-5);
        }

        .line-6 {
            background-color: var(--line-6);
        }

        .line-7 {
            background-color: var(--line-7);
        }

        .line-8 {
            background-color: var(--line-8);
        }

        .line-9 {
            background-color: var(--line-9);
        }

        .line-suin {
            background-color: var(--line-suin);
        }

        .line-gj {
            background-color: var(--line-gj);
        }

        .line-sbd {
            background-color: var(--line-sbd);
        }

        .line-ap {
            background-color: var(--line-ap);
        }

        .line-kk {
            background-color: var(--line-kk);
        }

        .line-sh {
            background-color: var(--line-sh);
        }

        .line-default {
            background-color: var(--line-default);
        }
    </style>
</head>

<body>

    <div class="monitor-container">
        <header>
            <h1>🚇 <span class="live-status">Live</span> 지하철 광역 모니터링 시스템</h1>
        </header>

        <div class="controls">
            <select id="regionSelect" onchange="updateRegionContext()">
                <option value="서울">서울특별시</option>
                <option value="경기">경기도</option>
                <option value="인천">인천광역시</option>
                <option value="부산">부산광역시</option>
                <option value="대구">대구광역시</option>
                <option value="대전">대전광역시</option>
                <option value="광주">광주광역시</option>
            </select>
            <select id="lineSelect" onchange="renderFeed()">
                <option value="전체">전체 호선</option>
            </select>
            <input type="text" id="stationInput" list="stationOptions" placeholder="출발역 이름을 입력하세요 (예: 강남역)">
            <datalist id="stationOptions"></datalist>
            <button onclick="addTrackingStation()"
                style="background: var(--accent-color); border: none; color: #0f172a; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer;">추가</button>
        </div>

        <div id="feed" class="departure-feed">
            <!-- 출발 정보가 여기에 동적으로 추가됩니다 -->
        </div>
    </div>

    <script>
        // 실시간 출발 관리를 위한 데이터 구조 (targetTimestamp 추가)
        let departureLog = [];

        // 데이터 저장 함수
        function saveToStorage() {
            localStorage.setItem('subwayTrackingList', JSON.stringify(departureLog));
        }

        // 데이터 불러오기 함수
        function loadFromStorage() {
            const saved = localStorage.getItem('subwayTrackingList');
            if (saved) return JSON.parse(saved);
            return [];
        }

        const stationDatabase = {
            "서울": ["강남역", "홍대입구", "서울역", "종로1가", "잠실역", "신도림역", "고속터미널"],
            "경기": ["수원역", "판교역", "정자역", "일산역", "부천역", "의정부역"],
            "인천": ["인천역", "부평역", "송도역", "인천시청역", "검암역"],
            "부산": ["부산역", "서면역", "해운대역", "광안리역", "사상역", "남포동역"],
            "대구": ["반월당역", "동대구역", "대구역", "중앙로역", "범어역"],
            "대전": ["대전역", "중앙로역", "유성온천역", "시청역", "판암역"],
            "광주": ["광주역", "상무역", "금남로4가역", "남광주역", "소태역"]
        };

        const lineDatabase = {
            "서울": ["1", "2", "3", "4", "5", "6", "7", "8", "9", "수인분당", "경의중앙", "신분당"],
            "경기": ["수인분당", "경의중앙", "신분당", "경강", "서해"],
            "인천": ["1", "2", "공항철도", "수인분당"],
            "부산": ["1", "2", "3", "4", "부산김해", "동해"],
            "대구": ["1", "2", "3"],
            "대전": ["1"],
            "광주": ["1"]
        };

        // 노선별 실제 종착역 데이터베이스
        const terminalDatabase = {
            "서울": {
                "1": ["소요산", "인천", "신창", "광명", "서동탄"],
                "2": ["성수순환", "신도림순환"],
                "3": ["대화", "오금"],
                "4": ["진접", "오이도"],
                "5": ["방화", "하남검단산", "마천"],
                "6": ["응암", "신내"],
                "7": ["장암", "석남"],
                "8": ["별내", "모란"],
                "9": ["개화", "중앙보훈병원"],
                "수인분당": ["청량리", "인천"],
                "경의중앙": ["문산", "용문", "지평"],
                "신분당": ["신사", "광교"]
            },
            "경기": { "수인분당": ["인천", "고색"], "경의중앙": ["문산", "용문"], "신분당": ["신사", "광교"], "경강": ["판교", "여주"], "서해": ["일산", "원시"] },
            "인천": { "1": ["계양", "송도달빛축제공원"], "2": ["검단오류", "운연"], "공항철도": ["서울역", "인천공항2터미널"], "수인분당": ["인천", "오이도"] },
            "부산": { "1": ["노포", "다대포해수욕장"], "2": ["양산", "장산"], "3": ["대저", "수영"], "4": ["안평", "미남"], "부산김해": ["사상", "가야대"], "동해": ["부전", "태화강"] },
            "대구": { "1": ["안심", "설화명곡"], "2": ["문양", "영남대"], "3": ["칠곡경대병원", "용지"] },
            "대전": { "1": ["반석", "판암"] },
            "광주": { "1": ["평동", "녹동"] }
        };

        // 노선 색상 클래스 매핑 함수
        function getLineClass(line) {
            if (!isNaN(line)) return `line-${line}`;
            if (line.includes('수인분당')) return 'line-suin';
            if (line.includes('경의중앙')) return 'line-gj';
            if (line.includes('신분당')) return 'line-sbd';
            if (line.includes('공항철도')) return 'line-ap';
            if (line.includes('경강')) return 'line-kk';
            if (line.includes('서해')) return 'line-sh';
            return 'line-default';
        }

        function renderFeed() {
            const region = document.getElementById('regionSelect').value;
            const lineFilter = document.getElementById('lineSelect').value;
            const feedContainer = document.getElementById('feed');

            feedContainer.innerHTML = '';

            const filteredData = departureLog.filter(item => {
                const matchRegion = item.region === region;
                const matchLine = lineFilter === '전체' || item.line === lineFilter;
                return matchRegion && matchLine;
            });

            if (filteredData.length === 0) {
                feedContainer.innerHTML = '<div style="text-align:center; padding:80px; color:#475569; font-size: 0.9rem; font-weight: 600;">[SYSTEM] NO ACTIVE TRACKING. INPUT STATION CODE TO BEGIN.</div>';
                return;
            }

            filteredData.forEach(item => {
                // 시간 및 진행도 계산
                const now = Date.now();
                const diff = Math.max(0, Math.floor((item.targetTimestamp - now) / 1000));
                const min = Math.floor(diff / 60);
                const sec = diff % 60;
                const timeText = diff > 0 ? `${min}:${sec < 10 ? '0' : ''}${sec}` : "출발함";
                const isUrgent = diff > 0 && diff < 60;

                // 진행도 계산 (움직이는 지하철)
                const progress = Math.min(100, Math.max(0, 100 - (diff / (item.initialTime || 300) * 100)));
                const lineClass = getLineClass(item.line);

                const html = `
                <div class="departure-item" style="border-left-color: var(--${lineClass})">
                    <div class="line-badge ${lineClass}">${isNaN(item.line) ? item.line[0] : item.line}</div>
                    <div class="status-info">
                        <span class="status-main">${item.station} 출발</span>
                        <span class="status-sub">${item.dest} 방면 열차</span>
                        <div class="track-container">
                            <div class="track-progress" style="width: ${progress}%; background-color: var(--${lineClass}); box-shadow: 0 0 8px var(--${lineClass})"></div>
                            <div class="train-icon ${diff > 0 ? 'train-running' : ''}" style="left: ${progress}%">🚇</div>
                        </div>
                    </div>
                    <div class="departure-time ${isUrgent ? 'urgent' : ''} ${diff > 0 ? 'time-update' : ''}">
                        ${timeText}
                    </div>
                </div>
            `;
                feedContainer.insertAdjacentHTML('beforeend', html);
            });
        }

        function updateRegionContext() {
            const region = document.getElementById('regionSelect').value;

            // 역 자동완성 업데이트
            const datalist = document.getElementById('stationOptions');
            datalist.innerHTML = '';
            (stationDatabase[region] || []).forEach(station => {
                datalist.insertAdjacentHTML('beforeend', `<option value="${station}">`);
            });

            // 호선 선택 옵션 업데이트
            const lineSelect = document.getElementById('lineSelect');
            lineSelect.innerHTML = '<option value="전체">전체 호선</option>';
            (lineDatabase[region] || []).forEach(line => {
                lineSelect.insertAdjacentHTML('beforeend', `<option value="${line}">${line}${isNaN(line) ? '' : '호선'}</option>`);
            });

            renderFeed();
        }

        // 사용자가 출발역을 직접 입력하여 추가하는 기능
        function addTrackingStation() {
            const input = document.getElementById('stationInput');
            const regionSelect = document.getElementById('regionSelect');
            const region = regionSelect.value;
            const line = document.getElementById('lineSelect').value;

            if (!input.value.trim()) return;

            // 현재 선택된 지역 정보 저장
            localStorage.setItem('lastRegion', region);
            localStorage.setItem('lastLine', line);

            const regionLines = lineDatabase[region] || ["1"];

            // 선택된 호선이 '전체'일 경우 랜덤 배정
            const selectedLine = line === '전체' ? regionLines[Math.floor(Math.random() * regionLines.length)] : line;
            // 종착역 데이터베이스에서 해당 노선의 종점 선택
            const terminals = (terminalDatabase[region] && terminalDatabase[region][selectedLine]) || ["종점"];
            const otherTerminals = terminals.filter(s => s !== input.value.trim());
            const randomDest = otherTerminals.length > 0 ? otherTerminals[Math.floor(Math.random() * otherTerminals.length)] : terminals[0];

            const initialTime = (Math.floor(Math.random() * 300) + 60);

            const newItem = {
                region: region,
                line: selectedLine,
                dest: randomDest + "행",
                station: input.value.trim(),
                initialTime: initialTime,
                targetTimestamp: Date.now() + initialTime * 1000 // 1~6분 사이 랜덤
            };

            departureLog.unshift(newItem);
            saveToStorage(); // 자동 저장
            input.value = '';
            renderFeed();
        }

        // 주기적으로 새로운 정보가 추가되는 것처럼 보이게 하는 시뮬레이션
        function simulateNewDeparture() {
            // 출발한 지 5초 지난 데이터 삭제
            const now = Date.now();
            const originalLength = departureLog.length;
            departureLog = departureLog.filter(item => (now - item.targetTimestamp) < 5000);

            if (departureLog.length !== originalLength) saveToStorage(); // 목록 변경 시 저장
            renderFeed();
        }

        window.onload = () => {
            // 예시 데이터 추가
            const savedLog = loadFromStorage();
            if (savedLog.length > 0) {
                const now = Date.now();
                departureLog = savedLog.map(item => ({
                    ...item,
                    // 저장된 데이터를 불러올 때 타이머를 초기 시간으로 재설정 (새 생명 부여)
                    targetTimestamp: now + (item.initialTime || 120) * 1000
                }));
            } else {
                departureLog.push({
                    region: "서울", line: "2", dest: "성수", station: "강남역",
                    initialTime: 120,
                    targetTimestamp: Date.now() + 120000
                });
            }

            // 마지막 지역 설정 불러오기
            const lastRegion = localStorage.getItem('lastRegion');
            if (lastRegion) document.getElementById('regionSelect').value = lastRegion;

            updateRegionContext();

            const lastLine = localStorage.getItem('lastLine');
            if (lastLine) document.getElementById('lineSelect').value = lastLine;

            setInterval(simulateNewDeparture, 1000); // 1초마다 실시간 갱신
        };
    </script>

</body>

</html>
